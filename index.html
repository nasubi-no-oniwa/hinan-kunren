  if(cur&&cur.s>=r.ms){setMsg(t('notbetter'),'');return;}
  const rec={n:myName(),s:r.ms,st:L.st,in:HK.enc(L.D,L.SL),v:HK.V,t:{'.sv':'timestamp'}};
  L.sent={board,rec};
  const res=await fetchR(DB(board+'/scores/'+a.uid)+Q(a),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});
  if(res.status===401||res.status===403){setMsg(t('late'),'err');return;}
  if(!res.ok)throw new Error('put '+res.status);
  sendState.canRename=true;MY={board,id:a.uid,n:rec.n,s:rec.s,t:Date.now()};
  const rk=await myRank(board,a.uid);setMsg(t('sent',{r:rk||'?'}),'ok');
  if(!$('result').hidden&&!ls.get('hk_name','')){$('rName').hidden=false;$('renameBtn').hidden=false;}
 }catch(e){console.warn(e);setMsg(t('senderr'),'err');}
}
$('renameBtn').onclick=async()=>{
 const n=$('rName').value.trim(),m=$('sendMsg');
 if(!n){m.textContent=t('needname');m.className='note err';return;}
 if(badName(n)){m.textContent=t('badname');m.className='note err';return;}
 ls.set('hk_name',n);if(!L.sent)return;$('renameBtn').disabled=true;
 try{const a=await fbAuth();const rec={...L.sent.rec,n,t:{'.sv':'timestamp'}};
  const res=await fetchR(DB(L.sent.board+'/scores/'+a.uid)+Q(a),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});
  if(!res.ok)throw new Error('rename '+res.status);if(MY)MY.n=n;m.textContent=t('renamed');m.className='note ok';$('rName').hidden=true;$('renameBtn').hidden=true;
 }catch(e){m.textContent=t('senderr');m.className='note err';}
 $('renameBtn').disabled=false;
};
$('nameIn').addEventListener('change',()=>{const n=$('nameIn').value.trim();if(n&&badName(n)){$('nameIn').value='';return;}ls.set('hk_name',n);});
// 生き残った人
let survN=0;
async function sendSurv(){
 try{const a=await fbAuth();
  if(!ls.get('hk_surv',0)){try{await cntPut('surv',a,{t:{'.sv':'timestamp'}});ls.set('hk_surv',1);}catch(_){}}
  survN=await cntNum('surv',false);
  if(!$('result').hidden&&L.res&&L.res.kind==='dig')$('rNote').textContent=t('survNote')+'　'+t('survCount',{n:survN.toLocaleString()});
 }catch(e){console.warn(e);}
}
async function cntNum(X,daily){try{if(daily){const r=await fetchR(DB(X+'t')+'.json');if(!r.ok)return 0;const j=await r.json();return j&&j.dk===dayKey(Date.now())?(+j.n||0):0;}const r=await fetchR(DB(X+'c')+'.json');if(!r.ok)return 0;const j=await r.json();return +j||0;}catch(e){return 0;}}
async function cntPut(X,a,rec){let ok=false;try{const [c,z]=await Promise.all([fetchR(DB(X+'/'+a.uid)+'.json').then(r=>r.ok?r.json():null),fetchR(DB(X+'t')+'.json').then(r=>r.ok?r.json():null)]);const today=dayKey(Date.now()),d0=today*86400000-32400000;const body={};body[X+'/'+a.uid]=rec;if(!c)body[X+'c']={'.sv':{increment:1}};if(!c||!(c.t>=d0)){if(z&&z.dk===today)body[X+'t/n']={'.sv':{increment:1}};else body[X+'t']={dk:today,n:1};}const r=await fetchR(DBROOT+QJ(a),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});ok=r.ok;}catch(_){}if(!ok){const r=await fetchR(DB(X+'/'+a.uid)+QJ(a),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});if(!r.ok)throw new Error('put '+r.status);}}
async function survCount(){const r=await fetchR(DB('surv')+'.json?shallow=true');if(!r.ok)return 0;const j=await r.json();return j?Object.keys(j).length:0;}
// ランキングは、1時間ごとにまとめた上位100人の表（top）を読む。自分の新しい記録はその場で表に足す
let MY=null;const BC={};
async function loadBoard(board){
 const c=BC[board];let rows;
 if(c&&Date.now()-c.t<60000)rows=c.rows;else{
  const tp=await fetchR(DB('top/'+board)+'.json').then(r=>r.ok?r.json():null).catch(()=>null);
  if(tp&&Array.isArray(tp.rows))rows=tp.rows.filter(r=>r&&typeof r.s==='number');
  else{const [d,h]=await Promise.all([fetch(DB(board+'/scores')+'.json?orderBy=%22s%22&limitToLast=100').then(r=>{if(!r.ok)throw 0;return r.json()}),fetch(DB('hidden')+'.json').then(r=>r.ok?r.json():null).catch(()=>null)]);
   rows=Object.entries(d||{}).map(([id,v])=>({id,n:v.n,s:v.s,t:v.t})).filter(r=>!(h&&h[r.id])&&typeof r.s==='number');}
  BC[board]={t:Date.now(),rows};}
 rows=rows.slice();
 if(MY&&MY.board===board){const i=rows.findIndex(r=>r.id===MY.id);if(i>=0){if(rows[i].s<=MY.s)rows[i]={...rows[i],n:MY.n,s:MY.s,t:MY.t};}else rows.push({id:MY.id,n:MY.n,s:MY.s,t:MY.t});}
 return rows.sort((a,b)=>b.s-a.s||a.t-b.t).slice(0,100);
}
async function myRank(board,uid){try{const rows=await loadBoard(board);const i=rows.findIndex(r=>r.id===uid);return i>=0?i+2:null;}catch(e){return null;}}
let rankFrom=false,rankRows=[],curBoard='all';
async function openRank(board,fromResult){
 rankFrom=!!fromResult;curBoard=board;show('rankPanel');
 const box=$('rankBox');box.innerHTML='<p>'+t('loading')+'</p>';
 try{
  const [rows,n]=await Promise.all([loadBoard(board),cntNum('surv',false)]);rankRows=rows;survN=n;const myId=(ls.get('hk_auth',null)||{}).uid;
  let h='<table class="rank"><tr class="top"><td class="r">1</td><td class="n">'+esc(t('survRow'))+'</td><td class="c">'+esc(t('people',{n:n.toLocaleString()}))+'</td><td></td></tr>';
  h+=rows.slice(0,100).map((r,i)=>'<tr'+(r.id===myId?' class="me"':'')+'><td class="r">'+(i+2)+'</td><td class="n">'+esc(r.n)+'<br><small style="color:var(--sub);font-size:11px">'+esc(grade(r.s))+'</small></td><td class="c">'+fmt(r.s)+t('sec')+'</td><td class="p"><button data-i="'+i+'">▶</button></td></tr>').join('');
  if(!rows.length)h+='<tr><td></td><td colspan="3">'+t('empty')+'</td></tr>';
  box.innerHTML=h+'</table>';
 }catch(e){box.innerHTML='<p>'+t('rankerr')+'</p>';}
}

$('rankBox').onclick=async e=>{const b=e.target.closest('button[data-i]');if(!b)return;const r=rankRows[+b.dataset.i];if(!r)return;b.disabled=true;try{const full=await fetchR(DB(curBoard+'/scores/'+r.id)+'.json').then(x=>x.ok?x.json():null);if(full&&full.in)startReplay({...full,id:r.id});}catch(_){}b.disabled=false;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== 上位の最後の場面を再生（記録の操作から作り直す） =====
// 最後の数秒をふつうの速さ → やられる所をスローで
function buildRun(seed,D,SL,from){
 const S=HK.create(seed);for(let i=0;i<from&&i<D.length;i++)HK.step(S,D[i],SL[i]);return S;
}
let RP=null;
function startReplay(rec){
 const o=HK.dec(rec.in);if(!o)return;
 show(null);clearFx();newRun();mode='replay';$('replayBar').hidden=false;$('replayTxt').textContent=t('replaying',{n:rec.n})+'  '+fmt(rec.s)+t('sec');
 $('hud').hidden=false;hole.visible=false;me.man.visible=true;
 const from=Math.max(0,o.D.length-8*TICK);
 RP={o,seed:HK.seedOf(rec.st),from,i:from,acc:0};L.S=buildRun(RP.seed,o.D,o.SL,from);L.px=L.S.x;L.pz=L.S.z;
}
function replayFrame(rdt){
 const o=RP.o,S=L.S;
 if(L.deadT!=null){const dt=rdt*slowK(L.deadT);L.deadT+=dt;if(L.deadT>DEAD_END+.6){clearFx();L.deadT=null;L.S=buildRun(RP.seed,o.D,o.SL,RP.from);RP.i=RP.from;L.px=L.S.x;L.pz=L.S.z;}return dt;}
 if(RP.i>=o.D.length&&!S.dead){L.S=buildRun(RP.seed,o.D,o.SL,RP.from);RP.i=RP.from;clearFx();return rdt;}
 RP.acc+=rdt;while(RP.acc>=1/TICK&&RP.i<o.D.length){RP.acc-=1/TICK;L.px=S.x;L.pz=S.z;HK.step(S,o.D[RP.i],o.SL[RP.i]);RP.i++;handleEv(S.ev);if(S.dead){L.deadT=0;SFX.hit();break;}}
 $('hudTime').textContent=fmt(HK.ms(S.tick));
 return rdt;
}
$('replayBack').onclick=()=>{$('replayBar').hidden=true;$('hud').hidden=true;clearFx();mode='title';L.deadT=null;openRank(curBoard,rankFrom);};

// ===== 動画（自分の回を作り直す。最後の数秒 → スロー） =====
let vidBlob=null,vidExt='mp4';
$('vidBtn').onclick=()=>makeVideo();
$('vBack').onclick=()=>show('result');
async function makeVideo(){
 const r=L.res;if(!r||!L.D.length)return;
 const can=document.createElement('canvas');const VW=540,VH=960;can.width=VW;can.height=VH;
 if(!can.captureStream||!window.MediaRecorder){show('vidPanel');$('vMsg').textContent=t('vfail');return;}
 show(null);mode='video';$('recBadge').hidden=false;$('recBadge').textContent='● '+t('making');
 const g=can.getContext('2d');
 const VR=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});VR.setSize(VW,VH,false);VR.setPixelRatio(1);
 const oldA=cam.aspect,oldD=camD;cam.aspect=VW/VH;cam.updateProjectionMatrix();
 fitCamOnly();
 ac();const dest=AC.createMediaStreamDestination();lp.connect(dest);
 const stream=can.captureStream(30);dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
 const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc3,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
 const mime=types.find(x=>{try{return MediaRecorder.isTypeSupported(x)}catch(e){return false}})||'';
 vidExt=mime.includes('mp4')?'mp4':'webm';
 let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{});}catch(e){finish(null);return;}
 const chunks=[];rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
 const D=L.D.slice(),SL=L.SL.slice(),seed=L.seed,isDig=r.kind==='dig',N=D.length;
 const from=Math.max(0,N-6*TICK);
 clearFx();const keep={S:L.S,px:L.px,pz:L.pz,deadT:L.deadT,digT:L.digT};
 let S=buildRun(seed,D,SL,from),i=from,acc=0,dT=null,gT=null,px=S.x,pz=S.z;SFX.muffle(false);
 const done=new Promise(res=>{rec.onstop=res;});
 rec.start(200);
 let lastF=performance.now(),endAt=null;
 await new Promise(resolve=>{
  function step(now){
   const rdt=Math.min(.05,(now-lastF)/1000);lastF=now;let dt=rdt;
   if(dT==null&&gT==null){acc+=rdt;while(acc>=1/TICK&&i<N){acc-=1/TICK;px=S.x;pz=S.z;HK.step(S,D[i],SL[i]);i++;handleEv(S.ev);if(S.dead){dT=0;SFX.hit();break;}}
    if(i>=N&&isDig&&gT==null){gT=0;S.ghost=true;SFX.dig();setTimeout(()=>SFX.muffle(true),500);}}
   else if(dT!=null){dt=rdt*slowK(dT);dT+=dt;if(dT>DEAD_END&&endAt==null)endAt=now;}
   else{gT+=rdt;acc+=rdt;while(acc>=1/TICK){acc-=1/TICK;px=S.x;pz=S.z;HK.step(S,0,0);handleEv(S.ev);}if(gT>3.5&&endAt==null)endAt=now;}
   const a=(dT==null&&gT==null)?Math.min(1,acc*TICK):1;
   syncBombs(S,dT==null?S.tick-1+a:S.tick);poseMan({S,x:px+(S.x-px)*a,z:pz+(S.z-pz)*a,deadT:dT,digT:gT},dt);stepFx(dt);
   shake=Math.max(0,shake-rdt*2.5);placeCam(camD,shake*.5);
   VR.render(S3,cam);g.drawImage(VR.domElement,0,0,VW,VH);
   g.textAlign='center';g.lineJoin='round';g.lineWidth=8;g.strokeStyle='#000a';const txt=(s,x,y)=>{g.strokeText(s,x,y);g.fillText(s,x,y);};
   g.fillStyle='#fff';g.font='900 30px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(t('hud'),VW/2,52);
   g.font='900 54px system-ui,sans-serif';txt(fmt(HK.ms(S.tick)),VW/2,112);
   if(dT!=null&&dT<SLOW_UNTIL){g.fillStyle='#ffcc00';g.font='900 32px system-ui,sans-serif';txt('SLOW',VW/2,160);}
   if(endAt!=null||(dT!=null&&dT>1.1)||(gT!=null&&gT>1.5)){
    g.fillStyle=isDig?'#7dff8a':'#ffcc00';g.font='900 72px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(isDig?t('survBig'):fmt(r.ms)+t('sec'),VW/2,VH-230);
    g.fillStyle='#fff';g.font='900 32px "Hiragino Maru Gothic ProN",system-ui,sans-serif';txt(isDig?t('surv'):t('ttl')+'「'+grade(r.ms)+'」',VW/2,VH-172);
   }
   g.fillStyle='#fffc';g.font='700 22px system-ui,sans-serif';txt(GAME_URL.replace('https://',''),VW/2,VH-40);
   if(endAt!=null&&now-endAt>900)resolve();else requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
 });
 rec.stop();await done;
 try{lp.disconnect(dest);}catch(_){}
 VR.dispose();clearFx();SFX.muffle(false);cam.aspect=oldA;cam.updateProjectionMatrix();camD=oldD;placeCam(camD,0);
 Object.assign(L,keep);
 finish(new Blob(chunks,{type:(mime||'video/webm').split(';')[0]}));
 function finish(blob){
  $('recBadge').hidden=true;mode='result';show('vidPanel');vidBlob=blob;
  if(!blob||!blob.size){$('vMsg').textContent=t('vfail');$('vShare').hidden=true;$('vSave').hidden=true;return;}
  const url=URL.createObjectURL(blob);$('vidPrev').src=url;$('vidPrev').play().catch(()=>{});
  const file=new File([blob],'hinan.'+vidExt,{type:blob.type});
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  $('vShare').hidden=!canShare;$('vSave').hidden=false;
  $('vMsg').textContent=canShare?t('vmade'):t('shareHint');
  $('vShare').onclick=async()=>{try{await navigator.share({files:[file],text:postText()+'\n'+GAME_URL});}catch(e){}};
  $('vSave').onclick=()=>{const a=document.createElement('a');a.href=url;a.download='hinan_'+(isDig?'surv':fmt(r.ms))+'.'+vidExt;document.body.appendChild(a);a.click();a.remove();};
 }
}
// 動画の形（縦長）にカメラを合わせる
function fitCamOnly(){
 const pts=[[-AW-.3,-AH-.3],[AW+.3,-AH-.3],[-AW-.3,AH+.3],[AW+.3,AH+.3]];let lo=8,hi=90;
 for(let i=0;i<30;i++){const d=(lo+hi)/2;placeCam(d,0);cam.updateMatrixWorld();let ok=true;for(const [x,z] of pts){const p=new THREE.Vector3(x,0,z).project(cam);if(Math.abs(p.x)>.96||p.y>.62||p.y<-.72)ok=false;}if(ok)hi=d;else lo=d;}
 camD=hi;placeCam(camD,0);
}

// ===== 宣伝動画を撮るための道具（遊びには使わない） =====
const PV={};
function pvInit(seed,enc,from,ghost){
 mode='video';show(null);$('hud').hidden=true;$('ctrl').hidden=true;$('pcKeys').hidden=true;$('big').innerHTML='';clearFx();newRun();hole.visible=false;me.man.visible=true;
 const o=enc?HK.dec(enc):null;const S=HK.create(seed);if(ghost)S.ghost=true;
 for(let i=0;i<from;i++){if(o)HK.step(S,o.D[i],o.SL[i]);else HK.step(S,0,0);}
 Object.assign(PV,{o,i:from,acc:0,dT:null});L.S=S;L.px=S.x;L.pz=S.z;L.deadT=null;
}
function pvFrame(dt){
 const S=L.S,ev=[];let d2=dt;
 if(PV.dT==null){PV.acc+=dt;while(PV.acc>=1/TICK){PV.acc-=1/TICK;L.px=S.x;L.pz=S.z;const k=PV.o&&PV.i<PV.o.D.length?PV.i:-1;HK.step(S,k>=0?PV.o.D[k]:0,k>=0?PV.o.SL[k]:0);PV.i++;
  for(const x of S.ev){if(x.e==='boom'){boomFx(x.b);ev.push('b'+(x.b.k==='big'?2:x.b.k==='final'?3:1));}else if(x.e==='slide')ev.push('s');else if(x.e==='warn'&&(x.b.k==='big'||x.b.k==='aim'))ev.push('w');}
  if(S.dead){PV.dT=0;ev.push('d');break;}}}
 else{d2=dt*slowK(PV.dT);PV.dT+=d2;}
 const a=PV.dT==null?Math.min(1,PV.acc*TICK):1;
 syncBombs(S,PV.dT==null?S.tick-1+a:S.tick);poseMan({S,x:L.px+(S.x-L.px)*a,z:L.pz+(S.z-L.pz)*a,deadT:PV.dT,digT:null},d2);stepFx(d2);
 shake=Math.max(0,shake-dt*2.5);placeCam(camD,shake*.5);R.render(S3,cam);
 $('alarm').classList.toggle('on',!!S.final);
 return {ev,tick:S.tick,dT:PV.dT,ms:HK.ms(S.tick)};
}
// ===== はじめ =====
fit();applyLang();showTitle();try{R.compile(S3,cam);}catch(e){}requestAnimationFrame(frame);
window.__hk={L,get mode(){return mode},HK,startDig,pressSlide,boomFx,stepFx,DBG,show,pvInit,pvFrame,grade,t,set joyDir(v){joyDir=v},get slid(){return slid}};
